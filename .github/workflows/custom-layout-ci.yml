name: Custom Layout quick scalability gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  quick-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: '3.12'
      - run: uv python install 3.12
      - run: uv sync --locked
      - name: Check one-entry asymptotics and moderate changes
        run: uv run pytest -q tests/test_custom_layout_scalability.py
